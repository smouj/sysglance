name: Bug report
description: Something in SysGlance does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report. Please fill this in as precisely as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SysGlance
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SysGlance version
      description: Shown in the app status bar
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 (19045)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Relevant lines from the app log (%APPDATA%/SysGlance/log.txt)
      render: text
    validations:
      required: false
