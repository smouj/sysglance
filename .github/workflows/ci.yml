name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax, config and UI contract
        run: npm run verify
      - name: Refresh-cycle benchmark
        run: npm run bench -- --iterations=5
      - name: Headless Electron smoke test
        run: xvfb-run -a npx electron . --self-test --no-sandbox --disable-gpu

  build-windows:
    name: Build installer (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build NSIS installer
        run: npm run build:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build packages (Linux)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build AppImage + deb
        run: npm run build:linux
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
