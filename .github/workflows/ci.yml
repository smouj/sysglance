name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── gates: syntax, settings validation, shell harness, headless smoke test ──
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax gate (node --check)
        run: npm run verify:syntax

      - name: Settings validation
        run: npm run verify:config

      - name: Shell harness
        run: npm run verify:shell

      # Electron needs a display; Xvfb provides one. The app reads real metrics
      # and asserts the preload bridge from inside the sandboxed renderer.
      - name: Headless smoke test
        run: xvfb-run -a npx electron . --self-test --no-sandbox

      - name: Refresh-cycle benchmark
        run: npm run bench -- --iterations=5

  # ── the installer is built where it is actually installable ──
  build-windows:
    name: Build installer (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # Tags publish the installer as a release asset (no npm publish).
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  # ── linux artifacts, so the AppImage/deb config keeps being exercised ──
  build-linux:
    name: Build packages (Linux)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage + deb
        run: npm run build:linux

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
