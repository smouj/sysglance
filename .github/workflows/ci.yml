name: CI

# Releases are handled by .github/workflows/release.yml (triggered by a v* tag),
# so this workflow deliberately does not run on tags — one owner per release.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── gates: syntax, settings validation, shell harness, headless smoke test ──
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a host without the Windows registry the shell harness self-skips its
      # live checks; the same command also exercises metrics, profiles,
      # displays, IPC and the desktop-action security gates.
      - name: Full verification suite
        run: npm run verify

      - name: Refresh-cycle benchmark
        run: npm run bench -- --iterations=5

      # The panel only lists home folders that exist, and a fresh runner home has
      # none of them, so the self-test's filesystem assertion would fail for an
      # environmental reason. Seed them so the check exercises real data.
      - name: Seed a standard home directory
        run: mkdir -p ~/Desktop ~/Documents ~/Downloads ~/Pictures ~/Videos ~/Music

      # Electron needs a display; Xvfb provides one. The app reads real metrics
      # and asserts the preload bridge from inside the sandboxed renderer.
      - name: Headless smoke test
        run: xvfb-run -a npx electron . --self-test --no-sandbox --disable-gpu

  # ── the installer is built where it is actually installable ──
  build-windows:
    name: Build installer (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax gate
        run: npm run verify:syntax

      - name: Settings validation
        run: npm run verify:config

      - name: Product action and persistence gates
        run: npm run verify:actions && npm run verify:journal && npm run verify:displays

      - name: Full verification suite (Windows)
        run: npm run verify

      - name: Build native shell helper
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-native.ps1

      - name: Build NSIS installer
        run: npm run build:win

      - name: Verify packaged uninstaller path
        shell: powershell
        env:
          SYSGLANCE_PACKAGE_DIR: dist
        run: npm run verify:install

      - name: Build portable package
        run: npm run build:win:portable

      - name: Verify portable package
        shell: powershell
        env:
          SYSGLANCE_PORTABLE_DIR: dist-portable
        run: npm run verify:portable

      - name: Verify release artifact identity
        shell: powershell
        env:
          SYSGLANCE_PACKAGE_DIR: dist
          SYSGLANCE_PORTABLE_DIR: dist-portable
        run: npm run verify:release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist-portable/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── linux artifacts, so the AppImage/deb config keeps being exercised ──
  build-linux:
    name: Build packages (Linux)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Windows helper is not needed by Linux, but electron-builder still
      # resolves the declared extraResource. A nonfunctional placeholder keeps
      # this cross-platform packaging smoke test deterministic after checkout.
      - name: Provide Windows-only helper placeholder
        run: mkdir -p src/native/shell && touch src/native/shell/SysGlanceShellHelper.exe

      - name: Build AppImage + deb
        run: npm run build:linux

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: SysGlance-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
