name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tag must match package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Verify runtime and UI contract
        run: npm run verify
      - name: Build NSIS installer
        run: npm run build:win
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt || certutil -hashfile *.exe SHA256
          cat SHA256SUMS.txt
      - name: Publish release with installer assets
        uses: softprops/action-gh-release@v2
        with:
          name: SysGlance ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
