name: Release

# Publishing a release:
#
#   git tag -a v1.2.0 -m "SysGlance 1.2.0"
#   git push origin v1.2.0
#
# The tag must match the `version` field in package.json — the app reads it from
# there (`app.getVersion()`), so a mismatch ships an installer whose UI disagrees
# with its own filename. The job verifies that before building anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full verification suite
        run: npm run verify

      - name: Lifecycle recovery gate
        run: npm run verify:lifecycle

      - name: Tag must match package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # The shell harness is intentionally not run here: GitHub's Windows
      # runners have no taskbar, so its live-state checks would fail for
      # environmental reasons. Run it on a real desktop instead.
      - name: Syntax gate
        run: npm run verify:syntax

      - name: Settings validation
        run: npm run verify:config

      - name: Build native shell helper
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-native.ps1

      - name: Build NSIS installer
        run: npm run build:win

      - name: Verify packaged uninstaller path
        shell: powershell
        env:
          SYSGLANCE_PACKAGE_DIR: dist
        run: npm run verify:install

      - name: Build portable package
        run: npm run build:win:portable

      - name: Verify portable package
        shell: powershell
        env:
          SYSGLANCE_PORTABLE_DIR: dist-portable
        run: npm run verify:portable

      - name: Verify signed release artifacts
        shell: powershell
        env:
          SYSGLANCE_PACKAGE_DIR: dist
          SYSGLANCE_PORTABLE_DIR: dist-portable
          SYSGLANCE_REQUIRE_SIGNING: '1'
        run: npm run verify:release

      - name: Checksums
        shell: powershell
        run: |
          Get-ChildItem dist -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash, $_.Path.Substring((Resolve-Path dist).Path.Length + 1) } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem dist-portable -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash, $_.Path.Substring((Resolve-Path dist-portable).Path.Length + 1) } |
            Set-Content -Encoding ascii dist-portable/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          Get-Content dist-portable/SHA256SUMS.txt

      - name: Publish release with the installer as an asset
        uses: softprops/action-gh-release@v2
        with:
          name: SysGlance ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
            dist-portable/*.exe
            dist-portable/SHA256SUMS.txt
          fail_on_unmatched_files: true
