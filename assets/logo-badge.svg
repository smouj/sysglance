<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" role="img" aria-label="SysGlance">
  <!-- The mark on its own plate. assets/logo.svg draws the mark in white on
       transparency, which disappears on a light page (GitHub's light theme, a
       white installer background); this variant is what the README uses. -->
