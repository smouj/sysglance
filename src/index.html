<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>SysGlance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <!-- Title bar (only visible when unlocked) -->
  <div id="title-bar" class="title-bar">
    <div class="title-left">
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="6" fill="currentColor" opacity="0.6"/><path d="M16 2 L16 8 M16 24 L16 30 M2 16 L8 16 M24 16 L30 16" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="title-text">SysGlance</span>
    </div>
    <div class="title-right">
      <button id="btn-lock" class="title-btn" title="Lock position (overlay mode)">🔒</button>
      <button id="btn-compact" class="title-btn" title="Toggle compact mode">📐</button>
      <button id="btn-minimize" class="title-btn" title="Hide overlay">−</button>
    </div>
  </div>

  <!-- Main content -->
  <div id="content" class="content">
    <!-- CPU Section -->
    <div class="section" id="sec-cpu">
      <div class="section-header">
        <span class="section-icon">⚡</span>
        <span class="section-title">CPU</span>
        <span class="section-value" id="cpu-load">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="cpu-bar"></div></div>
      <div class="info-row">
        <span id="cpu-model" class="info-subtitle">Loading...</span>
        <span id="cpu-temp" class="info-badge">—</span>
      </div>
      <div class="info-row">
        <span id="cpu-speed" class="info-small">— GHz</span>
        <span id="cpu-cores" class="info-small">— cores</span>
      </div>
      <div id="cpu-percore" class="percore-grid"></div>
    </div>

    <!-- Memory Section -->
    <div class="section" id="sec-memory">
      <div class="section-header">
        <span class="section-icon">🧠</span>
        <span class="section-title">Memory</span>
        <span class="section-value" id="mem-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="mem-bar"></div></div>
      <div class="info-row">
        <span id="mem-used" class="info-small">— / — GB</span>
        <span id="mem-swap" class="info-small">Swap: —</span>
      </div>
    </div>

    <!-- GPU Section -->
    <div class="section" id="sec-gpu">
      <div class="section-header">
        <span class="section-icon">🎮</span>
        <span class="section-title">GPU</span>
        <span class="section-value" id="gpu-load">—</span>
      </div>
      <div id="gpu-info" class="info-row">
        <span id="gpu-name" class="info-subtitle">No GPU data</span>
      </div>
      <div id="gpu-bars"></div>
    </div>

    <!-- Disks Section -->
    <div class="section" id="sec-disks">
      <div class="section-header">
        <span class="section-icon">💾</span>
        <span class="section-title">Disks</span>
      </div>
      <div id="disk-list"></div>
    </div>

    <!-- Network Section -->
    <div class="section" id="sec-network">
      <div class="section-header">
        <span class="section-icon">🌐</span>
        <span class="section-title">Network</span>
        <span id="net-iface" class="info-small"></span>
      </div>
      <div class="net-row">
        <div class="net-direction">
          <span class="net-arrow down">↓</span>
          <span id="net-rx" class="net-value">0 B/s</span>
        </div>
        <div class="net-direction">
          <span class="net-arrow up">↑</span>
          <span id="net-tx" class="net-value">0 B/s</span>
        </div>
      </div>
    </div>

    <!-- Processes Section -->
    <div class="section" id="sec-processes">
      <div class="section-header">
        <span class="section-icon">📊</span>
        <span class="section-title">Top Processes</span>
      </div>
      <div id="proc-list" class="proc-list"></div>
    </div>

    <!-- Battery Section (hidden if no battery) -->
    <div class="section" id="sec-battery" style="display:none;">
      <div class="section-header">
        <span class="section-icon">🔋</span>
        <span class="section-title">Battery</span>
        <span class="section-value" id="bat-pct">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="bat-bar"></div></div>
      <div class="info-row">
        <span id="bat-status" class="info-small">—</span>
      </div>
    </div>

    <!-- OS Info (compact footer) -->
    <div class="section section-footer" id="sec-os">
      <div class="os-row">
        <span id="os-distro" class="os-info">Loading...</span>
        <span id="os-uptime" class="os-info"></span>
      </div>
    </div>
  </div>

  <!-- Opacity slider (bottom, subtle) -->
  <div id="opacity-control" class="opacity-control">
    <span class="opacity-label">Opacity</span>
    <input type="range" id="opacity-slider" min="20" max="100" value="88" class="opacity-slider">
  </div>

  <script src="renderer.js"></script>
</body>
</html>
