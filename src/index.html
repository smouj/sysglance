<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- No inline script anywhere: script-src stays 'self' with no escape hatch.
       style-src keeps 'unsafe-inline' because the progress bars are sized with
       inline style attributes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>SysGlance</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Shell panel (self-contained: markup is injected by shell/panel.js) -->
  <link rel="stylesheet" href="shell/panel.css">
</head>
<body data-theme="dark" data-layout="sidebar">

  <!-- Settings Panel -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <span class="settings-title">⚙️ Settings</span>
      <button id="btn-close-settings" class="settings-close">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <div class="settings-label">Layout</div>
        <div class="settings-options" id="layout-options">
          <button class="settings-opt" data-layout="sidebar">Sidebar</button>
          <button class="settings-opt" data-layout="dock">Dock</button>
          <button class="settings-opt" data-layout="corner">Mini</button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label">Position</div>
        <div class="settings-options" id="anchor-options">
          <button class="settings-opt" data-anchor="top-right">↗</button>
          <button class="settings-opt" data-anchor="top-left">↖</button>
          <button class="settings-opt" data-anchor="bottom-right">↘</button>
          <button class="settings-opt" data-anchor="bottom-left">↙</button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label">Theme</div>
        <div class="settings-options" id="theme-options">
          <button class="settings-opt" data-theme="dark">🌙 Dark</button>
          <button class="settings-opt" data-theme="light">☀️ Light</button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label">Opacity <span id="opacity-val">90%</span></div>
        <input type="range" id="settings-opacity" min="30" max="100" value="90" class="settings-slider">
      </div>
      <div class="settings-group">
        <div class="settings-label">Fast refresh <span id="refresh-val">1.5s</span></div>
        <input type="range" id="settings-refresh" min="500" max="5000" step="500" value="1500" class="settings-slider">
      </div>
      <div class="settings-group">
        <div class="settings-label">Hardware refresh <span id="slow-val">7.0s</span></div>
        <input type="range" id="settings-slow" min="5000" max="10000" step="1000" value="7000" class="settings-slider">
      </div>
      <div class="settings-group">
        <div class="settings-label">Sections</div>
        <div class="settings-toggles" id="section-toggles">
          <label class="toggle-row"><input type="checkbox" data-section="cpu" checked><span>CPU</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="memory" checked><span>Memory</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="gpu" checked><span>GPU</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="filesystem" checked><span>Files</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="disks" checked><span>Disks</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="network" checked><span>Network</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="processes" checked><span>Processes</span></label>
          <label class="toggle-row"><input type="checkbox" data-section="battery" checked><span>Battery</span></label>
        </div>
      </div>
      <div class="settings-group">
        <button id="btn-lock-settings" class="settings-action">🔒 Lock Position</button>
        <button id="btn-compact-settings" class="settings-action">📐 Compact Mode</button>
      </div>
      <div class="settings-group settings-meta">
        <div id="metric-info" class="info-small">fast — · hardware —</div>
        <div id="app-info" class="info-small">SysGlance</div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar">
    <div class="status-left">
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none"><path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="16" cy="16" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg>
      <span class="status-title">SysGlance</span>
      <span id="app-version" class="status-version">v—</span>
      <span id="status-clock" class="status-clock"></span>
    </div>
    <div class="status-right">
      <span id="perf-readout" class="status-metric" title="Measured refresh cost">⏱ —</span>
      <button id="btn-lock" class="status-btn" title="Lock/Unlock">🔒</button>
      <button id="btn-settings" class="status-btn" title="Settings">⚙️</button>
      <button id="btn-minimize" class="status-btn" title="Hide">−</button>
    </div>
  </div>

  <div id="content" class="content">
    <div class="section" id="sec-cpu">
      <div class="section-header"><span class="section-icon">⚡</span><span class="section-title">CPU</span><span class="section-value" id="cpu-load">—</span></div>
      <div class="progress-bar"><div class="progress-fill" id="cpu-bar"></div></div>
      <div class="info-row"><span id="cpu-model" class="info-subtitle">Loading...</span><span id="cpu-temp" class="info-badge" style="display:none"></span></div>
      <div class="info-row"><span id="cpu-speed" class="info-small"></span><span id="cpu-cores" class="info-small"></span></div>
      <div id="cpu-percore" class="percore-grid"></div>
    </div>
    <div class="section" id="sec-memory">
      <div class="section-header"><span class="section-icon">🧠</span><span class="section-title">Memory</span><span class="section-value" id="mem-pct">—</span></div>
      <div class="progress-bar"><div class="progress-fill" id="mem-bar"></div></div>
      <div class="info-row"><span id="mem-used" class="info-small">— / —</span><span id="mem-swap" class="info-small"></span></div>
    </div>
    <div class="section" id="sec-gpu">
      <div class="section-header"><span class="section-icon">🎮</span><span class="section-title">GPU</span><span class="section-value" id="gpu-load">—</span></div>
      <div class="info-row"><span id="gpu-name" class="info-subtitle">No GPU</span></div>
      <div id="gpu-bars"></div>
    </div>
    <div class="section" id="sec-filesystem">
      <div class="section-header"><span class="section-icon">📁</span><span class="section-title">Files</span><span id="fs-home" class="info-small"></span></div>
      <div id="fs-folders" class="fs-grid"></div>
    </div>
    <div class="section" id="sec-disks">
      <div class="section-header"><span class="section-icon">💾</span><span class="section-title">Disks</span></div>
      <div id="disk-list"></div>
    </div>
    <div class="section" id="sec-network">
      <div class="section-header"><span class="section-icon">🌐</span><span class="section-title">Network</span><span id="net-iface" class="info-small"></span></div>
      <div class="net-row"><div class="net-direction"><span class="net-arrow down">↓</span><span id="net-rx" class="net-value">—</span></div><div class="net-direction"><span class="net-arrow up">↑</span><span id="net-tx" class="net-value">—</span></div></div>
    </div>
    <div class="section" id="sec-processes">
      <div class="section-header"><span class="section-icon">📊</span><span class="section-title">Top Processes</span></div>
      <div id="proc-list" class="proc-list"></div>
    </div>
    <div class="section" id="sec-battery" style="display:none">
      <div class="section-header"><span class="section-icon">🔋</span><span class="section-title">Battery</span><span class="section-value" id="bat-pct">—</span></div>
      <div class="progress-bar"><div class="progress-fill" id="bat-bar"></div></div>
      <div class="info-row"><span id="bat-status" class="info-small"></span></div>
    </div>
    <div class="section section-footer" id="sec-os">
      <div class="os-row"><span id="os-distro" class="os-info">Loading...</span><span id="os-uptime" class="os-info"></span></div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script src="shell/panel.js"></script>
</body>
</html>
