<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>SysGlance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark" data-layout="sidebar" class="unlocked">
  <svg width="0" height="0" aria-hidden="true" focusable="false" class="icon-sprite">
    <defs>
      <g id="i-cpu"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></g>
      <g id="i-memory"><rect x="2.5" y="7" width="19" height="9" rx="2"/><path d="M6.5 16v3M10.5 16v3M14.5 16v3M18.5 16v3M7 10.5h1.5M11 10.5h1.5M15 10.5h1.5"/></g>
      <g id="i-gpu"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="8.5" cy="12" r="2.8"/><path d="M16 9.5v5M20.5 15.5v2.5"/></g>
      <g id="i-network"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 3.2 2.4 14.8 0 18M12 3c-2.4 3.2-2.4 14.8 0 18"/></g>
      <g id="i-disks"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></g>
      <g id="i-processes"><path d="M5 20v-8M12 20V5M19 20v-6"/></g>
      <g id="i-files"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.9 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g>
      <g id="i-battery"><rect x="2.5" y="7.5" width="16" height="9" rx="2"/><path d="M21.5 10.5v3"/></g>
      <g id="i-lock"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></g>
      <g id="i-unlock"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 7.6-1.8"/></g>
      <g id="i-gear"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.5 1A8 8 0 0 0 14.7 6l-.4-2.7h-4L9.9 6A8 8 0 0 0 8.2 7L5.7 6 3.7 9.4l2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.7h4l.4-2.7a8 8 0 0 0 1.7-1l2.5 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></g>
      <g id="i-hide"><path d="M5 9.5l7 6 7-6"/></g>
      <g id="i-close"><path d="M6 6l12 12M18 6L6 18"/></g>
    </defs>
  </svg>

  <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-modal="true" aria-label="SysGlance settings">
    <div class="settings-header">
      <div><div class="settings-kicker">SYSGLANCE</div><div class="settings-title">Display settings</div></div>
      <button id="btn-close-settings" class="icon-button" aria-label="Close settings"><svg class="ic" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="settings-grid">
      <div class="settings-group settings-span-2"><div class="settings-label">Layout</div><div class="segmented" id="layout-options"><button data-layout="sidebar">Sidebar</button><button data-layout="dock">Dock</button><button data-layout="corner">Mini</button></div></div>
      <div class="settings-group"><div class="settings-label">Theme</div><div class="segmented" id="theme-options"><button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="lcd">LCD</button></div></div>
      <div class="settings-group"><div class="settings-label">Anchor</div><div class="segmented" id="anchor-options"><button data-anchor="top-left">↖</button><button data-anchor="top-right">↗</button><button data-anchor="bottom-left">↙</button><button data-anchor="bottom-right">↘</button></div></div>
      <div class="settings-group settings-span-2"><div class="settings-label"><span>Opacity</span><span id="opacity-val" class="setting-value">94%</span></div><input id="settings-opacity" class="range" type="range" min="45" max="100" value="94"></div>
      <div class="settings-group"><div class="settings-label"><span>Live refresh</span><span id="refresh-val" class="setting-value">1.5s</span></div><input id="settings-refresh" class="range" type="range" min="750" max="5000" step="250" value="1500"></div>
      <div class="settings-group"><div class="settings-label"><span>Hardware refresh</span><span id="slow-val" class="setting-value">7s</span></div><input id="settings-slow" class="range" type="range" min="5000" max="15000" step="1000" value="7000"></div>
      <div class="settings-group settings-span-2"><div class="settings-label">Sections</div><div id="section-toggles" class="section-toggles">
        <label><input type="checkbox" data-section="cpu" checked><span>CPU</span></label><label><input type="checkbox" data-section="memory" checked><span>Memory</span></label><label><input type="checkbox" data-section="gpu" checked><span>GPU</span></label><label><input type="checkbox" data-section="network" checked><span>Network</span></label><label><input type="checkbox" data-section="disks" checked><span>Storage</span></label><label><input type="checkbox" data-section="processes" checked><span>Processes</span></label><label><input type="checkbox" data-section="filesystem" checked><span>Folders</span></label><label><input type="checkbox" data-section="battery" checked><span>Battery</span></label>
      </div></div>
    </div>
    <div class="settings-footer"><span id="metric-info">Metrics ready</span><span id="app-info">SysGlance</span></div>
  </div>

  <header class="topbar">
    <div class="brand"><svg class="logo" viewBox="0 0 512 512" fill="none"><path d="M256 16L464 136V376L256 496L48 376V136L256 16Z" stroke="currentColor" stroke-width="24"/><circle cx="256" cy="256" r="100" stroke="currentColor" stroke-width="20"/><circle cx="256" cy="256" r="40" fill="currentColor"/><path d="M256 156V96M256 356V416M156 256H96M356 256H416M186 186L146 146M326 186L366 146M186 326L146 366M326 326L366 366" stroke="currentColor" stroke-width="8"/></svg><div class="brand-copy"><span class="brand-name">SysGlance</span><span id="app-version" class="brand-version">v—</span></div></div>
    <div class="topbar-right"><span id="perf-readout" class="perf">— ms</span><span id="status-clock" class="clock">--:--</span><div class="topbar-actions"><button id="btn-lock" class="icon-button"><svg class="ic ic-lock" viewBox="0 0 24 24"><use href="#i-lock"/></svg><svg class="ic ic-unlock" viewBox="0 0 24 24"><use href="#i-unlock"/></svg></button><button id="btn-settings" class="icon-button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gear"/></svg></button><button id="btn-minimize" class="icon-button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-hide"/></svg></button></div></div>
  </header>

  <main id="content" class="content">
    <div class="primary-grid">
      <section id="sec-cpu" class="metric-card"><div class="metric-head"><span class="metric-label"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cpu"/></svg>CPU</span><span id="cpu-temp" class="badge hidden"></span></div><div class="metric-main"><span id="cpu-load" class="metric-value">—</span><span class="metric-unit">%</span></div><div class="meter"><div id="cpu-bar" class="meter-fill"></div></div><div class="metric-meta"><span id="cpu-model">Loading…</span><span id="cpu-speed"></span></div><div id="cpu-percore" class="core-strip"></div></section>
      <section id="sec-memory" class="metric-card"><div class="metric-head"><span class="metric-label"><svg class="ic" viewBox="0 0 24 24"><use href="#i-memory"/></svg>Memory</span><span id="mem-swap" class="badge subtle"></span></div><div class="metric-main"><span id="mem-pct" class="metric-value">—</span><span class="metric-unit">%</span></div><div class="meter"><div id="mem-bar" class="meter-fill"></div></div><div class="metric-meta"><span id="mem-used">—</span><span></span></div></section>
      <section id="sec-gpu" class="metric-card"><div class="metric-head"><span class="metric-label"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gpu"/></svg>GPU</span><span id="gpu-temp" class="badge hidden"></span></div><div class="metric-main"><span id="gpu-load" class="metric-value">—</span><span class="metric-unit">%</span></div><div class="meter"><div id="gpu-bar" class="meter-fill"></div></div><div class="metric-meta"><span id="gpu-name">Detecting…</span><span id="gpu-vram"></span></div></section>
      <section id="sec-network" class="metric-card"><div class="metric-head"><span class="metric-label"><svg class="ic" viewBox="0 0 24 24"><use href="#i-network"/></svg>Network</span><span id="net-iface" class="badge subtle"></span></div><div class="network-values"><div><span class="arrow down">↓</span><strong id="net-rx">—</strong><small>down</small></div><div><span class="arrow up">↑</span><strong id="net-tx">—</strong><small>up</small></div></div></section>
    </div>
    <section id="sec-disks" class="detail-card storage-card"><div class="detail-head"><span><svg class="ic" viewBox="0 0 24 24"><use href="#i-disks"/></svg>Storage</span><span id="disk-summary" class="detail-summary"></span></div><div id="disk-list" class="disk-list"></div></section>
    <section id="sec-processes" class="detail-card process-card"><div class="detail-head"><span><svg class="ic" viewBox="0 0 24 24"><use href="#i-processes"/></svg>Top processes</span><span class="detail-summary">CPU · MEM</span></div><div id="proc-list" class="proc-list"></div></section>
    <section id="sec-filesystem" class="detail-card folder-card"><div class="detail-head"><span><svg class="ic" viewBox="0 0 24 24"><use href="#i-files"/></svg>Home folders</span><span id="fs-home" class="detail-summary"></span></div><div id="fs-folders" class="folder-grid"></div></section>
    <section id="sec-battery" class="detail-card battery-card hidden-section"><div class="detail-head"><span><svg class="ic" viewBox="0 0 24 24"><use href="#i-battery"/></svg>Battery</span><span id="bat-status" class="detail-summary"></span></div><div class="battery-row"><strong id="bat-pct">—</strong><div class="meter"><div id="bat-bar" class="meter-fill"></div></div></div></section>
  </main>
  <footer class="footer"><span id="os-distro">Loading system…</span><span id="os-uptime"></span></footer>
  <script src="renderer.js"></script>
</body>
</html>
